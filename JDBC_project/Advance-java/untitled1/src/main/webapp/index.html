<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<title>Student Registration</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        width: 420px;
        background: white;
        padding: 35px;
        border-radius: 18px;

        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .container h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #333;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #444;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px 14px;

        border: 1px solid #ddd;
        border-radius: 9px;

        font-size: 15px;
        outline: none;

        transition: 0.3s;
    }

    .form-group input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .register-btn {
        width: 100%;
        padding: 13px;

        border: none;
        border-radius: 9px;

        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
        transition: 0.3s;
    }

    .register-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(102, 126, 234, 0.35);
    }

    .footer-text {
        text-align: center;
        margin-top: 20px;
        color: #888;
        font-size: 13px;
    }
</style>
</body>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <p class="subtitle">
        Fill in your details to register
    </p>

    <form action="register" method="post">

        <div class="form-group">
            <label>Name</label>
            <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input
                    type="text"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>
        </div>

        <div class="form-group">
            <label>Course</label>
            <input
                    type="text"
                    name="course"
                    placeholder="Enter your course"
                    required>
        </div>

        <button type="submit" class="register-btn">
            Register Student
        </button>

    </form>

    <p class="footer-text">
        Your information will be securely stored.
    </p>

</div>

</body>
</html>
